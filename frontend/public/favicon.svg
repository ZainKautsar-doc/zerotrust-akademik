<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a324b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05060f" stop-opacity="1" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#663af3" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#027dea" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8ecf8" />
      <stop offset="100%" stop-color="#663af3" stop-opacity="0.2" />
    </linearGradient>

    <!-- Checkmark / Lock Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1e4fa" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Disc (Theme Matched) -->
  <rect width="64" height="64" rx="18" fill="#05060f" />
  <rect width="64" height="64" rx="18" fill="url(#bgGlow)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(186, 215, 247, 0.25)" stroke-width="1.5" />

  <!-- Shield Base with Glow -->
  <path d="M32 9 L49 16 C49 31 42 46 32 53 C22 46 15 31 15 16 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.25" 
        stroke="url(#rimGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Shackle (Padlock Top) -->
  <path d="M26 29 V25 C26 21.686 28.686 19 32 19 C35.314 19 38 21.686 38 25 V29" 
        stroke="url(#coreGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="23" y="29" width="18" height="15" rx="4" 
        fill="url(#shieldGrad)" 
        stroke="#d8ecf8" 
        stroke-width="1.8" />

  <!-- Keyhole Dot -->
  <circle cx="32" cy="35" r="2" fill="#ffffff" />
  <path d="M32 37 V40" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Security Verification Check Sparkle -->
  <circle cx="47" cy="18" r="3" fill="#10b981" />
  <circle cx="47" cy="18" r="5" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
</svg>
